{% extends "base.html" %}
{% block title %}Voice | Yard Assistant{% endblock %}
{% block content %}
<section class="card">
  <h2>Upload Voice Note</h2>
  <p>The original audio and transcript are saved before factual extraction.</p>
  <form id="voice-upload" action="/api/voice" method="post" enctype="multipart/form-data" class="form-stack">
    <label for="file">Audio file (up to 32 MiB)</label>
    <input id="file" name="file" type="file" accept="audio/*" required>
    <button type="submit">Upload and process</button>
  </form>
  <p id="upload-status" role="status"></p>
  <a id="review-link" hidden>Review saved log</a>
</section>
<script src="/static/voice-result.js"></script>
<script>
(() => {
  const form = document.getElementById('voice-upload');
  const status = document.getElementById('upload-status');
  const link = document.getElementById('review-link');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = form.querySelector('button');
    button.disabled = true;
    link.hidden = true;
    status.textContent = 'Uploading and processing…';
    try {
      const response = await fetch(form.action, {method: 'POST', body: new FormData(form)});
      const data = await response.json();
      if (data.id) {
        const result = window.describeVoiceResult(data);
        status.textContent = result.message;
        link.href = `/logs/${data.id}`;
        link.hidden = false;
      } else {
        status.textContent = data.detail || 'Upload failed; no saved record was returned.';
      }
    } catch (error) {
      status.textContent = 'Request failed. Check Transcripts before uploading again.';
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
{% endblock %}
