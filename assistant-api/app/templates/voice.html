{% extends "base.html" %}
{% block title %}Glasovni pregled | Yard Assistant{% endblock %}
{% block content %}
<section class="card">
  <h2>Otpremi glasovnu belešku</h2>
  <p class="muted workflow-intro">Audio se koristi privremeno. Podaci se čuvaju tek kada potvrdite pregled.</p>
  <form id="voice-upload" class="form-stack">
    <label for="file">Audio datoteka (do 32 MiB)</label>
    <input id="file" name="file" type="file" accept="audio/*" required>
    <button type="submit">Pripremi karticu za proveru</button>
  </form>
  <p id="upload-status" role="status"></p>
</section>
<section class="card review-card" id="review-card" aria-live="polite"></section>
<script src="/static/review-card.js"></script>
<script>
(() => {
  const form = document.getElementById('voice-upload');
  const status = document.getElementById('upload-status');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!window.canReplaceReview()) return;
    const button = form.querySelector('button'); button.disabled = true;
    status.textContent = 'Transkripcija i izdvajanje podataka…';
    try {
      const response = await fetch('/api/voice', {method: 'POST', body: new FormData(form)});
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Priprema kartice nije uspela.');
      await window.showReviewCard(data);
      form.reset(); status.textContent = 'Proverite karticu i potvrdite čuvanje.';
    } catch (error) { status.textContent = error.message; }
    finally { button.disabled = false; }
  });
})();
</script>
{% endblock %}
