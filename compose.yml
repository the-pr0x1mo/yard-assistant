services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    gpus: all
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  assistant-api:
    build: ./assistant-api
    container_name: assistant-api
    gpus: all
    env_file:
      - .env
    volumes:
      - /mnt/data/yard-assistant:/data
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama:
